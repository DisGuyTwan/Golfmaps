name: CI

# This repository had no automation at all. Lint, typecheck, tests and build on
# every PR — src/lib/area.ts drives the acreage a quote is built from, so a
# silent regression there produces a confidently wrong number.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

      # build before typecheck: next-env.d.ts is gitignored and regenerated by
      # Next, and it declares the module types for static asset imports. This
      # repo has none today, so a standalone tsc passes — but it would start
      # failing the moment someone imports an image, which is a confusing way
      # to find out.
      - run: npm run build
      - run: npm run typecheck
