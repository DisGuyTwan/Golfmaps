version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # Majors are a deliberate, scheduled decision — not a standing queue.
      # Without this the first run opened breaking upgrades (TypeScript 5->7,
      # ESLint 9->10, actions v4->v7) alongside the routine patches.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # Majors are a deliberate, scheduled decision — not a standing queue.
      # Without this the first run opened breaking upgrades (TypeScript 5->7,
      # ESLint 9->10, actions v4->v7) alongside the routine patches.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
